function cardDay(d,i){return `<article class="card day-card" onclick="location.hash='days/${d.date}'"><div class="daytop"><span class="daynum">DAY ${i+1}</span><span class="tag">${d.dow}・${d.city}</span></div><h3>${fmtDate(d.date)}</h3><strong>${esc(d.theme)}</strong><div class="muted">住宿：${esc(d.hotel)}</div><div class="muted">${d.items.length} 個行程節點　→ 查看當日</div></article>`}
function home(){return `<section class="hero"><div class="eyebrow">TRAVEL JOURNAL · JAPAN</div><h1>${esc(TRIP.title)}</h1><p>${TRIP.dateLabel}｜${TRIP.country}｜${TRIP.travelers}。依上傳 Excel 整理的靜態旅遊手帳，保留原始時間與備註，未確認的資訊會明確標示。</p><div class="chips"><span class="chip">🗓 6 天行程</span><span class="chip">🚗 自駕</span><span class="chip">📍 北部・中部・那霸・南部</span><span class="chip">📒 資料版本 ${TRIP.version}</span></div></section>
<section class="section"><div class="section-head"><h2>旅程章節</h2><span class="sub">點擊卡片開啟當日時間軸</span></div><div class="grid">${TRIP.days.map(cardDay).join("")}</div></section>
<section class="section"><div class="section-head"><h2>旅程快速入口</h2></div><div class="grid"><article class="card"><h3>🚗 交通與轉乘</h3><p class="muted">航班、租車接駁、每日自駕節點與返程安排。</p><a href="#transit">開啟交通中心 →</a></article><article class="card"><h3>🛏 住宿安排</h3><p class="muted">名護、Luana Uakoko、那霸美居。</p><a href="#hotels">查看住宿 →</a></article><article class="card"><h3>🎟 票券與待辦</h3><p class="muted">已買票／已預約資訊與待購票項目分開整理。</p><a href="#tools">管理票券與待辦 →</a></article></div></section>
<section class="section"><div class="section-head"><h2>需要優先確認</h2><span class="tag">依 Excel 原文整理</span></div><div class="grid"><div class="notice"><b>11/23 時間重疊</b><br>玉泉洞 08:45–09:45，Gangala 之谷 09:45–11:30，但備註需預約 10:00 場次。</div><div class="notice"><b>11/24 午後安排重疊</b><br>瀨長島 13:30–15:30，幸福鬆餅備註預約約 14:00–15:30。</div><div class="notice"><b>餐廳時間待核對</b><br>11/20 Gajimaru Cafe&Bar 預計 17:00–18:30，但 Excel 註記營業 12:00–15:00。</div></div></section>
<section class="section"><div class="section-head"><h2>資料與使用說明</h2></div><div class="card"><p>本網站是 Excel 的資料快照，不會自動與原始 Excel 同步。基本行程可離線閱讀；Google Maps、天氣與遠端圖片需要網路。網站未加入護照、密碼或私人票券 QR Code。</p><p class="muted">來源：${TRIP.source}。資料版本日期：${TRIP.version}。地圖使用 Google Maps 搜尋連結；天氣由 Open-Meteo 公開 API 提供，無需 API Key。</p></div></section>`}
function dayPanel(d){let idx=TRIP.days.indexOf(d);let events=d.items.map((it,i)=>{let [time,name,place,note,type]=it;let query=place||name;return `<div class="event"><div class="time">${esc(time)}</div><h3>${esc(name)}</h3>${place?`<p>📍 ${esc(place)}</p>`:""}${note?`<p class="muted">${esc(note)}</p>`:""}${type?`<span class="tag">${esc(type)}</span>`:""}<div class="actions"><a class="smallbtn" target="_blank" rel="noopener" href="${maps(query)}">Google Maps 定位／導航 ↗</a></div></div>`}).join("");
return `<div class="cover"><span class="tag">DAY ${idx+1} · ${d.dow}</span><h2>${fmtDate(d.date)}｜${esc(d.city)}</h2><p>${esc(d.theme)}</p><p>🛏 當日住宿：${esc(d.hotel)}</p><div class="actions"><a class="smallbtn" href="#days/${TRIP.days[Math.max(0,idx-1)].date}">← 前一天</a><a class="smallbtn" href="#days/${TRIP.days[Math.min(TRIP.days.length-1,idx+1)].date}">下一天 →</a></div></div>
<div class="grid"><section class="card weatherbox"><h3>🌤 當地天氣</h3><p class="muted">行程日期的預報可能尚未發布；天氣頁會明確提示可用預報範圍。</p><iframe title="沖繩天氣預報" loading="lazy" src="weather.html?city=${encodeURIComponent(d.city)}&date=${d.date}"></iframe><div class="actions"><a class="smallbtn" target="_blank" rel="noopener" href="https://open-meteo.com/">天氣資料來源：Open-Meteo ↗</a></div></section><section class="card"><h3>🗺 當日動線地圖</h3><p class="muted">下方為依行程順序的定位清單；Google Maps 會開啟各點搜尋或導航。清單不代表實際道路路線。</p><div class="maplist">${d.items.filter(x=>x[1]&&x[1]!=="前往機場"&&x[1]!=="出境／吃早餐"&&x[1]!=="出境"&&x[1]!=="前往租車店"&&x[1]!=="前往水族館"&&x[1]!=="前往午餐"&&x[1]!=="前往晚餐"&&x[1]!=="前往飯店").map((x,i)=>`<div class="mapstop"><b>${i+1}</b>${esc(x[1])}<br><a target="_blank" rel="noopener" href="${maps(x[2]||x[1])}">地圖 ↗</a></div>`).join("")}</div></section></div>
<section class="section"><div class="section-head"><h2>當日時間軸</h2><span class="sub">${d.items.length} 個節點</span></div><div class="card"><div class="timeline">${events}</div></div></section>
<section class="section"><div class="section-head"><h2>當日提醒</h2></div><div class="card">${d.items.filter(x=>x[3]).map(x=>`<p>• <b>${esc(x[1])}</b>：${esc(x[3])}</p>`).join("")||'<p class="muted">Excel 未提供其他提醒；必要資訊待確認。</p>'}</div></section>`}
function daysPage(date){const d=TRIP.days.find(x=>x.date===date)||TRIP.days[0];return `<div class="section-head"><h2>每日日程</h2><span class="sub">每日獨立網址：#days/YYYY-MM-DD</span></div><div class="tabs mobile-days">${TRIP.days.map((x,i)=>`<button class="${x.date===d.date?'active':''}" onclick="location.hash='days/${x.date}'">D${i+1} ${x.date.slice(5).replace('-','/')}</button>`).join("")}</div><div class="day-layout"><aside class="day-list">${TRIP.days.map((x,i)=>`<button class="${x.date===d.date?'active':''}" onclick="location.hash='days/${x.date}'">DAY ${i+1}<br>${x.date.slice(5).replace('-','/')}（${x.dow}）<br><small>${esc(x.city)}</small></button>`).join("")}</aside><div>${dayPanel(d)}</div></div>`}
function transit(){let all=[];TRIP.days.forEach((d,i)=>d.items.forEach(x=>{if(x[4]==="交通"||["起飛","出境","前往租車店","還車","機場"].includes(x[1]))all.push({date:d.date,day:i+1,time:x[0],name:x[1],place:x[2],note:x[3]})}));return `<section class="hero"><div class="eyebrow">TRANSPORT HUB</div><h1>交通與轉乘中心</h1><p>依 Excel 的交通節點排列；未提供的航班號、租車商與確切地址均標示待確認。</p></section><section class="section itemlist">${all.map(t=>`<article class="itemcard"><div class="daytop"><span class="daynum">${fmtDate(t.date)}</span><span class="tag">DAY ${t.day}</span></div><h3>${esc(t.name)}</h3><p><b>時間：</b>${esc(t.time)}</p>${t.place?`<p><b>地點：</b>${esc(t.place)}</p>`:""}${t.note?`<p class="muted">${esc(t.note)}</p>`:""}<span class="status pending">預訂／付款狀態待確認</span><div class="actions">${t.place?`<a class="smallbtn" target="_blank" rel="noopener" href="${maps(t.place)}">定位起／終點 ↗</a>`:""}<a class="smallbtn" href="#days/${t.date}">查看當日行程</a></div></article>`).join("")}</section><section class="section"><h2>轉乘與時間矛盾</h2><div class="card"><p>• 11/19 航班起飛 06:55–09:15，抵達後出境 09:15–10:15；請核對這些時間是否為當地時間及實際航班時刻。</p><p>• 11/24 16:00 還車、17:30 機場、20:10–20:55 起飛；還車地址與接駁時間待確認。</p><p class="muted">提前抵達時間若需安排，屬行前建議，非 Excel 或航空公司官方要求。</p></div></section>`}
function hotels(){return `<section class="hero"><div class="eyebrow">STAY NOTES</div><h1>住宿手帳</h1><p>住宿日期依行程安排整理；原始 Excel 未提供完整地址、房型、早餐、訂房金額與付款狀態的欄位值，均保留為待確認。</p></section><section class="section grid">${TRIP.hotels.map((h,i)=>`<article class="card"><span class="daynum">住宿 ${i+1}</span><h3 style="margin-top:12px">${esc(h.name)}</h3><p>📅 ${esc(h.date)}｜${esc(h.nights)}</p><p>📍 ${esc(h.address)}</p><p>🕒 入住：${esc(h.checkin)}<br>退房：${esc(h.checkout)}</p><p>💳 付款：<span class="status pending">${esc(h.payment)}</span></p><p>🧾 預訂：<span class="status pending">${esc(h.booking)}</span></p><p class="muted">${esc(h.note)}</p><a class="smallbtn" target="_blank" rel="noopener" href="${maps(h.name)}">Google Maps 導航 ↗</a></article>`).join("")}</section>`}
function food(){let foods=[];TRIP.days.forEach(d=>d.items.forEach(x=>{if(x[4]==="餐廳")foods.push({date:d.date,city:d.city,time:x[0],name:x[1],place:x[2],note:x[3]})}));return `<section class="hero"><div class="eyebrow">FOOD & CAFE</div><h1>餐飲清單</h1><p>只整理 Excel 中出現的餐廳、咖啡館與甜點。未在原始資料明確指定的飲食偏好不會自行加入。</p></section><section class="section"><div class="filters"><select id="foodDate" onchange="filterFood()"><option value="">所有日期</option>${TRIP.days.map(d=>`<option value="${d.date}">${fmtDate(d.date)}</option>`).join("")}</select><input id="foodSearch" placeholder="搜尋餐廳或備註…" oninput="filterFood()"></div><p id="foodCount" class="sub"></p><div id="foodList" class="itemlist">${foods.map(f=>`<article class="itemcard fooditem" data-date="${f.date}" data-search="${esc((f.name+" "+f.place+" "+f.note).toLowerCase())}"><div class="daytop"><span class="daynum">${fmtDate(f.date)}</span><span class="tag">${esc(f.city)}</span></div><h3>${esc(f.name)}</h3><p>時間：${esc(f.time)}｜地點：${esc(f.place||"待確認")}</p>${f.note?`<p class="muted">${esc(f.note)}</p>`:""}<span class="status pending">訂位狀態待確認</span><div class="actions"><a class="smallbtn" target="_blank" rel="noopener" href="${maps(f.place||f.name)}">Google Maps 定位 ↗</a></div></article>`).join("")}</div></section>`}
function tools(){return `<section class="hero"><div class="eyebrow">TICKETS & CHECKLIST</div><h1>票券與待辦</h1><p>購票狀態、預約狀態與付款狀態分開處理；Excel 未明確提供的資訊不自行推定。</p></section><section class="section"><div class="section-head"><h2>票券／預約</h2></div><div class="filters"><select id="ticketType" onchange="filterTickets()"><option value="">所有類別</option><option>景點</option><option>景點／導覽</option></select><select id="ticketStatus" onchange="filterTickets()"><option value="">所有狀態</option><option>待購票</option><option>待預約</option><option>已預約／已購票（Excel 原文）</option></select></div><p id="ticketCount" class="sub"></p><div id="ticketList" class="itemlist">${TRIP.ticketIdeas.map((t,i)=>`<article class="itemcard ticket" data-type="${esc(t.type)}" data-status="${esc(t.status)}"><div class="daytop"><span class="daynum">${esc(t.date)}</span><span class="tag">${esc(t.type)}</span></div><h3>${esc(t.name)}</h3><p>狀態：<span class="status ${t.status.includes("已")?"done":"pending"}">${esc(t.status)}</span></p><p>付款狀態：${esc(t.payment)}｜金額：${esc(t.amount)}｜幣別：${esc(t.currency)}</p><p class="muted">${esc(t.note)}</p></article>`).join("")}</div></section><section class="section"><div class="section-head"><h2>出發前待辦</h2><span id="todoProgress" class="sub"></span></div><div class="card todo" id="todoList">${TRIP.todos.map(t=>`<label><input type="checkbox" data-id="${t.id}" onchange="saveTodos()"><span>${esc(t.text)}</span></label>`).join("")}</div><div class="actions"><button class="btn primary" onclick="exportTodos()">匯出 JSON</button><label class="btn">匯入 JSON<input id="importFile" type="file" accept="application/json" hidden onchange="importTodos(event)"></label><button class="btn" onclick="resetTodos()">重設勾選</button></div><p class="sub">勾選狀態只保存在目前瀏覽器的 localStorage，不會跨裝置自動同步。</p></section><section class="section"><h2>待確認事項</h2><div class="card"><ul><li>11/23 玉泉洞與 Gangala 之谷行程時間重疊，且 Gangala 備註預約 10:00。</li><li>11/24 瀨長島與幸福鬆餅的時間重疊。</li><li>11/20 Gajimaru Cafe&Bar 預計用餐時間與 Excel 所列營業時間不一致。</li><li>11/22 國際通行程至 19:00，但備註建議週日 12:00–18:00 前往。</li><li>航班號、租車公司、住宿完整地址、房型、付款狀態、票券金額多數未提供。</li><li>Excel 的日期格式為民國 115 年，已轉換顯示為 2026 年；原始時間與文字備註保留。</li></ul></div></section>`}
function render(){let hash=location.hash.slice(1)||"home";let [page,arg]=hash.split("/");let content=page==="days"?daysPage(arg):page==="transit"?transit():page==="hotels"?hotels():page==="food"?food():page==="tools"?tools():home();$("#app").innerHTML=content;setActive();if(page==="tools")loadTodos();if(page==="food")filterFood();if(page==="tools")filterTickets()}
window.addEventListener("hashchange",render);
function filterFood(){let date=$("#foodDate")?.value||"",s=($("#foodSearch")?.value||"").toLowerCase();let n=0;document.querySelectorAll(".fooditem").forEach(e=>{let ok=(!date||e.dataset.date===date)&&e.dataset.search.includes(s);e.classList.toggle("hidden",!ok);if(ok)n++});if($("#foodCount"))$("#foodCount").textContent=`符合 ${n} 間／筆餐飲紀錄`}
function filterTickets(){let type=$("#ticketType")?.value||"",status=$("#ticketStatus")?.value||"",n=0;document.querySelectorAll(".ticket").forEach(e=>{let ok=(!type||e.dataset.type===type)&&(!status||e.dataset.status===status);e.classList.toggle("hidden",!ok);if(ok)n++});if($("#ticketCount"))$("#ticketCount").textContent=`符合 ${n} 項票券／預約紀錄`}
function saveTodos(){let o={};document.querySelectorAll("#todoList input[type=checkbox]").forEach(c=>o[c.dataset.id]=c.checked);localStorage.setItem("okinawa-trip-todos",JSON.stringify(o));updateProgress()}
function loadTodos(){let o={};try{o=JSON.parse(localStorage.getItem("okinawa-trip-todos")||"{}")}catch{}document.querySelectorAll("#todoList input[type=checkbox]").forEach(c=>c.checked=!!o[c.dataset.id]);updateProgress()}
function updateProgress(){let c=[...document.querySelectorAll("#todoList input[type=checkbox]")];if($("#todoProgress"))$("#todoProgress").textContent=`已完成 ${c.filter(x=>x.checked).length}／${c.length} 項`}
function exportTodos(){let o={};document.querySelectorAll("#todoList input[type=checkbox]").forEach(c=>o[c.dataset.id]=c.checked);let b=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),todos:o},null,2)],{type:"application/json"});let a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="okinawa-todos.json";a.click();URL.revokeObjectURL(a.href)}
function importTodos(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);localStorage.setItem("okinawa-trip-todos",JSON.stringify(x.todos||x));loadTodos()}catch{alert("JSON 格式無法讀取")}};r.readAsText(f)}
function resetTodos(){if(confirm("確定清除目前瀏覽器儲存的待辦勾選？")){localStorage.removeItem("okinawa-trip-todos");loadTodos()}}
render();
</script></body></html>
