<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;background:#f7f2e7;color:#263b32;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;padding:12px}button{background:#24483b;color:white;border:0;border-radius:99px;padding:7px 12px}small,.muted{color:#6f786e}.forecast{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-top:12px}.day{background:#fffdf7;border:1px solid #e5dac7;border-radius:12px;padding:10px}.temp{font-size:1.25rem;font-weight:800}.err{background:#fbebe3;padding:10px;border-radius:10px}
</style></head><body><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b id="title">沖繩天氣</b><button onclick="load()">重新整理</button></div><p id="msg" class="muted">正在取得最新預報…</p><div id="out"></div><small>資料來源：Open-Meteo（免費天氣 API）。預報範圍有限，較遠日期不會以今天天氣或歷史平均代替。</small>
<script>
const p=new URLSearchParams(location.search),city=p.get("city")||"沖繩",date=p.get("date")||"2026-11-19";
const cities={"名護・本部・古宇利島":[26.59,127.98],"讀谷・殘波岬・名護":[26.38,127.74],"沖繩中部・北谷":[26.31,127.76],"北谷・那霸":[26.27,127.73],"那霸・南部":[26.16,127.67],"那霸・瀨長島・返程":[26.17,127.65]};
const coord=cities[city]||[26.21,127.68];
const code={0:"晴朗",1:"大致晴朗",2:"局部多雲",3:"陰天",45:"霧",48:"霧凇",51:"毛毛雨",53:"毛毛雨",55:"較強毛毛雨",61:"小雨",63:"中雨",65:"大雨",71:"小雪",80:"陣雨",81:"較強陣雨",82:"強陣雨",95:"雷雨",96:"雷雨伴冰雹"};
function load(){document.querySelector("#title").textContent=city+"｜天氣";document.querySelector("#msg").textContent="正在更新預報…";document.querySelector("#out").innerHTML="";let start=date,end=new Date(date+"T00:00:00");end.setDate(end.getDate()+2);let e=end.toISOString().slice(0,10);
let now=new Date(),target=new Date(date+"T00:00:00");let diff=(target-now)/(86400000);
if(diff>16||diff< -1){document.querySelector("#msg").textContent="此日期不在可靠的短期預報範圍內，請接近出發日再查詢。";document.querySelector("#out").innerHTML='<div class="err">尚無可用的逐日預報。<br><a target="_blank" rel="noopener" href="https://www.jma.go.jp/bosai/forecast/">日本氣象廳預報 ↗</a></div>';return}
let url=`https://api.open-meteo.com/v1/forecast?latitude=${coord[0]}&longitude=${coord[1]}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=16`;
fetch(url).then(r=>{if(!r.ok)throw Error("API");return r.json()}).then(data=>{let ix=data.daily.time.indexOf(date);if(ix<0){document.querySelector("#msg").textContent="目前沒有這個日期的預報資料，請接近出發日再查。";return}document.querySelector("#msg").textContent="預報日期 "+date+" 起；更新時間："+new Date().toLocaleString("zh-TW");let a=[];for(let i=ix;i<Math.min(ix+3,data.daily.time.length);i++)a.push(`<div class="day"><b>${data.daily.time[i]}</b><p>${code[data.daily.weather_code[i]]||"天氣狀況待確認"}</p><div class="temp">${Math.round(data.daily.temperature_2m_max[i])}° / ${Math.round(data.daily.temperature_2m_min[i])}°C</div><p>降雨機率：${data.daily.precipitation_probability_max?.[i]??"—"}%</p></div>`);document.querySelector("#out").innerHTML='<div class="forecast">'+a.join("")+'</div>'}).catch(()=>{document.querySelector("#msg").textContent="目前無法取得即時天氣資料。";document.querySelector("#out").innerHTML='<div class="err">請稍後重試，或查看 <a target="_blank" rel="noopener" href="https://www.jma.go.jp/bosai/forecast/">日本氣象廳官方預報 ↗</a>。</div>'})}
load();
</script></body></html>
